name: Python lint
on:
  workflow_call:
    inputs:
      path:
        description: Folder to lint
        type: string
        default: "."
permissions:
  contents: read
jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: pipx run ruff check "$TARGET"
        env:
          TARGET: ${{ inputs.path }}
