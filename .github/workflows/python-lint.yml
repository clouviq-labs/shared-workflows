name: Python lint
on:
  workflow_call:
    inputs:
      path:
        description: Folder to lint
        type: string
        default: "."
permissions:
  contents: read
jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pipx run ruff check "$TARGET"
        env:
          TARGET: ${{ inputs.path }}
